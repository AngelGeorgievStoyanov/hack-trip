<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HackTrip — Travel, thoughtfully planned</title>
  <desc id="desc">A refined HackTrip travel brand composition in deep forest green, warm ivory and antique gold, featuring an HT monogram, a mapped travel route and a minimal airplane motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10251F"/>
      <stop offset=".58" stop-color="#1B382E"/>
      <stop offset="1" stop-color="#263F34"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8C39A"/>
      <stop offset=".5" stop-color="#B79A68"/>
      <stop offset="1" stop-color="#92764B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4EBDD" stop-opacity=".13"/>
      <stop offset="1" stop-color="#F4EBDD" stop-opacity=".025"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#07130F" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="60" r="310" fill="#D8C39A" opacity=".045"/>
  <circle cx="1120" cy="610" r="330" fill="#D8C39A" opacity=".035"/>
  <path d="M0 490 C180 425 300 520 470 460 S760 390 920 465 S1090 500 1200 435 V630 H0Z" fill="#091A14" opacity=".22"/>

  <g opacity=".09" stroke="#EDE3D1" fill="none" stroke-width="1">
    <path d="M0 126H1200M0 210H1200M0 294H1200M0 378H1200M0 462H1200M0 546H1200"/>
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>

  <g transform="translate(72 54)">
    <rect width="62" height="62" rx="15" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
    <text x="31" y="41" text-anchor="middle" fill="#F3EBDD" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="600" letter-spacing="-2">HT</text>
    <path d="M17 49H45" stroke="url(#gold)" stroke-width="1.2"/>
    <text x="82" y="28" fill="#F3EBDD" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="5">HACKTRIP</text>
    <text x="83" y="51" fill="#C9B995" font-family="Arial, sans-serif" font-size="10" letter-spacing="3.2">TRAVEL, YOUR WAY</text>
  </g>

  <g transform="translate(72 183)">
    <text fill="#CDB78D" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4.5">YOUR TRIP. YOUR ROUTE. YOUR STORY.</text>
    <text y="91" fill="#F5EFE4" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="500" letter-spacing="-1.5">Plan your trip.</text>
    <text y="166" fill="#F5EFE4" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="500" letter-spacing="-1.5">Discover your world.</text>
    <text y="220" fill="#D8D0C1" font-family="Arial, sans-serif" font-size="21">Plan each day. Save places anywhere. Share your route.</text>
    <g transform="translate(0 263)">
      <rect width="250" height="55" rx="3" fill="url(#gold)"/>
      <text x="125" y="35" text-anchor="middle" fill="#142820" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">DISCOVER HACKTRIP</text>
    </g>
  </g>

  <g transform="translate(710 105)" filter="url(#shadow)">
    <rect width="420" height="420" rx="20" fill="url(#glass)" stroke="#D8C39A" stroke-opacity=".35"/>
    <rect x="14" y="14" width="392" height="392" rx="14" fill="none" stroke="#F3EBDD" stroke-opacity=".10"/>
    <!-- Stylised terrain, coastline, roads and water: the map represents every kind of place -->
    <path d="M20 72C72 35 105 72 145 49S226 33 255 68 328 105 400 52V155C344 176 313 148 274 174S193 194 151 163 75 143 20 180Z" fill="#A9B9A5" opacity=".42"/>
    <path d="M20 270C82 235 120 275 169 249S259 224 302 258 365 274 406 244V406H20Z" fill="#9AAE9D" opacity=".24"/>
    <path d="M20 345C91 312 115 356 174 333S270 311 314 343 368 361 406 333" fill="none" stroke="#8CA99F" stroke-width="22" opacity=".35"/>
    <path d="M30 90C93 119 128 93 182 117S276 145 393 110M28 218C99 190 131 225 196 207S309 187 399 220M45 300C106 278 147 304 209 285S319 276 392 298" fill="none" stroke="#B9A98B" stroke-width="3" opacity=".7"/>
    <path d="M48 287 C94 245 130 250 175 186 S258 112 298 159 S346 225 374 91" fill="none" stroke="#B79A68" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
    <path d="M48 287 C94 245 130 250 175 186 S258 112 298 159 S346 225 374 91" fill="none" stroke="#FFF9ED" stroke-opacity=".85" stroke-width="1.4" stroke-dasharray="5 10"/>
    <!-- Mountain marker -->
    <g transform="translate(28 44)">
      <circle cx="18" cy="18" r="18" fill="#18372D" stroke="#D8C39A" stroke-width="1.5"/>
      <path d="M7 27 17 10 27 27Z" fill="#F3EBDD"/><path d="m16 12 5 8-5-2-3 4Z" fill="#B79A68"/>
    </g>
    <!-- City / landmark marker -->
    <g transform="translate(154 165)">
      <circle cx="18" cy="18" r="19" fill="#F3EBDD" stroke="#B79A68" stroke-width="2"/>
      <path d="M8 27V15h7v-6h7v6h6v12ZM17 27v-7h4v7" fill="#244336"/>
    </g>
    <!-- Restaurant marker -->
    <g transform="translate(277 137)">
      <circle cx="18" cy="18" r="19" fill="#B79A68" stroke="#F3EBDD" stroke-width="2"/>
      <path d="M12 8v10m-4-10v6q0 4 4 4t4-4V8m-4 10v10m12-20v20m0-20q-5 4-5 11h5" fill="none" stroke="#17372D" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Beach / coastal spot marker -->
    <g transform="translate(30 269)">
      <circle cx="18" cy="18" r="19" fill="#F3EBDD" stroke="#B79A68" stroke-width="2"/>
      <path d="M8 22q10-8 20 0M8 27q10-8 20 0" fill="none" stroke="#244336" stroke-width="2" stroke-linecap="round"/>
      <circle cx="18" cy="12" r="4" fill="#B79A68"/>
    </g>
    <!-- Viewpoint / GPS pin -->
    <g transform="translate(355 73)">
      <path d="M18 0C8 0 0 8 0 18c0 14 18 33 18 33s18-19 18-33C36 8 28 0 18 0Z" fill="#18372D" stroke="#D8C39A" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="6" fill="#D8C39A"/>
    </g>
    <!-- Airplane route endpoint -->
    <g transform="translate(337 222) rotate(18)">
      <path d="M0 13 58 0 39 23 28 20 17 42 13 25Z" fill="#F3EBDD"/>
    </g>
    <!-- Tiny map labels -->
    <g fill="#52675A" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.1">
      <text x="62" y="45">TRAIL</text><text x="197" y="158">CITY</text>
      <text x="318" y="132">FOOD</text><text x="58" y="306">BEACH</text>
      <text x="294" y="278">SCENIC ROUTE</text>
    </g>
    <g transform="translate(52 326)">
      <rect width="316" height="58" rx="5" fill="#18372D" opacity=".94"/>
      <circle cx="24" cy="29" r="5" fill="#D8C39A"/>
      <text x="40" y="25" fill="#F3EBDD" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">EVERY PLACE HAS A PIN</text>
      <text x="40" y="42" fill="#D8C39A" font-family="Arial,sans-serif" font-size="9" letter-spacing=".8">Cities · Food · Beaches · Nature · Hidden gems</text>
    </g>
    <text x="210" y="402" text-anchor="middle" fill="#D8C39A" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">PLAN  ·  EXPLORE  ·  SHARE</text>
  </g>

  <text x="72" y="590" fill="#C9B995" opacity=".75" font-family="Arial, sans-serif" font-size="10" letter-spacing="2.5">CURATED BY YOU. DISCOVERED WITH HACKTRIP.</text>
</svg>