    <text y="164" fill="#fff" font-family="Arial,sans-serif" font-size="66" font-weight="800">Share every stop.</text>
    <text y="218" fill="#e7eee8" font-family="Arial,sans-serif" font-size="25">Create itineraries. Save any GPS place. Discover more.</text>
